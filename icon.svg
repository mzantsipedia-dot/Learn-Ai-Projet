<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Salary Check icon: a gold Klimt-style mosaic on starry blue, with a rand sign in the middle. -->
  <defs>
    <pattern id="tiles" width="64" height="64" patternUnits="userSpaceOnUse">
      <rect width="64" height="64" fill="#1f3a8a"/>
      <rect x="6" y="6" width="20" height="20" fill="#d4a017" opacity="0.55"/>
      <rect x="38" y="38" width="20" height="20" fill="#d4a017" opacity="0.55"/>
      <circle cx="48" cy="16" r="7" fill="#e8c547"/>
      <circle cx="16" cy="48" r="4" fill="#e8c547"/>
    </pattern>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#tiles)"/>
  <circle cx="256" cy="256" r="150" fill="#1f3a8a" stroke="#d4a017" stroke-width="16"/>
  <circle cx="256" cy="256" r="122" fill="none" stroke="#e8c547" stroke-width="4" stroke-dasharray="14 10"/>
  <text x="256" y="300" text-anchor="middle" font-family="Georgia, serif" font-size="150" font-weight="700" fill="#d4a017">R</text>
</svg>
